<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='535' viewBox='0 0 1180 535'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#374151'/></marker></defs><rect x='0' y='0' width='1180' height='535' rx='12' fill='#ffffff'/><text x='590' y='34' font-family='Helvetica, Arial, sans-serif' font-size='16' font-weight='bold' fill='#1f2937' text-anchor='middle'>SystolicMesh: C = A × B + bias, sets streamed back to back</text><rect x='20' y='150' width='95' height='80' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='67' y='182' font-family='Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>Host</text><text x='67' y='200' font-family='Helvetica, Arial, sans-serif' font-size='13.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>A, B rows</text><rect x='145' y='85' width='160' height='90' rx='10' fill='#e0e7ff' stroke='#4f46e5' stroke-width='1.6'/><text x='225' y='112' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Staging banks ×2</text><text x='225' y='134' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>one matrix row per cycle;</text><text x='225' y='152' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>one fills while one drains</text><rect x='145' y='200' width='160' height='90' rx='10' fill='#e0e7ff' stroke='#4f46e5' stroke-width='1.6'/><text x='225' y='227' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Weight cache</text><text x='225' y='249' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>B tiles reused across</text><text x='225' y='267' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>row tiles: host sends A only</text><polyline points='115,175 143,135' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='115,205 143,245' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><rect x='340' y='70' width='330' height='240' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/><text x='505' y='96' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>(N/T)² systolic arrays, T×T PEs each</text><rect x='365' y='112' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='405' y='137' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='465' y='112' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='505' y='137' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='565' y='112' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='605' y='137' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='365' y='164' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='405' y='189' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='465' y='164' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='505' y='189' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='565' y='164' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='605' y='189' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='365' y='216' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='405' y='241' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='465' y='216' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='505' y='241' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><rect x='565' y='216' width='80' height='40' rx='6' fill='#ffffff' stroke='#60a5fa' stroke-width='1.2'/><text x='605' y='241' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>T×T</text><text x='505' y='288' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#4b5563' text-anchor='middle'>each array owns one output tile and runs the full depth K</text><polyline points='305,130 338,150' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='305,245 338,225' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><text x='322' y='196' font-family='Helvetica, Arial, sans-serif' font-size='1' font-weight='normal' fill='#1f2937' text-anchor='middle'></text><rect x='705' y='100' width='140' height='180' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='1.6'/><text x='775' y='135' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Reducer</text><text x='775' y='160' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>per output tile:</text><text x='775' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>adds the PEs'</text><text x='775' y='196' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>partial sums</text><text x='775' y='214' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>and the bias</text><rect x='880' y='100' width='135' height='180' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/><text x='947' y='135' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Result banks ×4</text><text x='947' y='160' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>finished sets wait</text><text x='947' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>here while the</text><text x='947' y='196' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>mesh moves on</text><rect x='1050' y='140' width='110' height='100' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.6'/><text x='1105' y='175' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>Consumer</text><text x='1105' y='193' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>wide read,</text><text x='1105' y='211' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>then release</text><polyline points='670,190 703,190' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='845,190 878,190' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='1015,190 1048,190' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><rect x='200' y='345' width='780' height='145' rx='12' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.3' stroke-dasharray='6 4'/><text x='590' y='370' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' fill='#1f2937' text-anchor='middle'>Processing element: one multiply-add every cycle</text><rect x='240' y='395' width='120' height='60' rx='8' fill='#ffffff' stroke='#2563eb' stroke-width='1.6'/><text x='300' y='420' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>a from the left,</text><text x='300' y='438' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' fill='#1f2937' text-anchor='middle'>b from above</text><rect x='400' y='400' width='70' height='50' rx='25' fill='#ffffff' stroke='#2563eb' stroke-width='1.6'/><text x='435' y='431' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#1f2937' text-anchor='middle'>×</text><rect x='510' y='400' width='70' height='50' rx='25' fill='#ffffff' stroke='#2563eb' stroke-width='1.6'/><text x='545' y='431' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' fill='#1f2937' text-anchor='middle'>+</text><rect x='620' y='385' width='330' height='80' rx='8' fill='#ffffff' stroke='#16a34a' stroke-width='1.6'/><text x='785' y='405' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>rotating partial sums (6 in fp32 and bf16)</text><text x='785' y='421' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>hide the adder latency; 4 banks let one set</text><text x='785' y='437' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>accumulate while earlier sets are read out;</text><text x='785' y='453' font-family='Helvetica, Arial, sans-serif' font-size='11.5' font-weight='normal' fill='#1f2937' text-anchor='middle'>a packed set skips products outside its block</text><polyline points='700,465 700,478 545,478 545,452' fill='none' stroke='#374151' stroke-width='1.6' marker-end='url(#ah)'/><polyline points='360,425 398,425' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='470,425 508,425' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><polyline points='580,425 618,425' fill='none' stroke='#374151' stroke-width='2' marker-end='url(#ah)'/><text x='590' y='518' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='normal' fill='#4b5563' text-anchor='middle'>a and b move one PE per cycle, so the next set starts the cycle after the last product of the current one</text></svg>
